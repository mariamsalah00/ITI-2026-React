<html>

<head>
    <title>Employee System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Employee Management System</h1>

        <!-- Name -->
        <div class="form-group">

            <label for="txtName">Employee Name</label>

            <input type="text" id="txtName" placeholder="Enter Employee Name">

            <span id="nameError" class="error"></span>

        </div>

        <!-- Age -->
        <div class="form-group">

            <label for="txtAge">Age</label>

            <input type="number" id="txtAge" placeholder="Enter Age">

            <span id="ageError" class="error"></span>

        </div>

        <!-- Salary -->
        <div class="form-group">

            <label for="txtSalary">Salary</label>

            <input type="number" id="txtSalary" placeholder="Enter Salary">

            <span id="salaryError" class="error"></span>

        </div>

        <!-- Department -->
        <div class="form-group">

            <label for="department">Department</label>

            <select id="department">

                <option value="">Choose Department</option>

                <option value="HR">HR</option>

                <option value="SD">SD</option>

                <option value="OS">OS</option>

            </select>

            <span id="departmentError" class="error"></span>

        </div>

        <!-- Add Button -->

        <button id="btnAdd">
            Add Employee
        </button>

        <hr>

        <!-- Sort -->

        <div class="form-group">

            <label for="sortSelect">Sort By</label>

            <select id="sortSelect">

                <option value="">Choose</option>

                <option value="Name">Name</option>

                <option value="Department">Department</option>

            </select>

        </div>

        <!-- Filter -->

        <div class="form-group">

            <label for="filterSelect">Filter By Department</label>

            <select id="filterSelect">

                <option value="All">All</option>

                <option value="HR">HR</option>

                <option value="SD">SD</option>

                <option value="OS">OS</option>

            </select>

        </div>

        <hr>

        <table>

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Age</th>

                    <th>Department</th>

                    <th>Salary</th>

                    <th>Delete</th>

                </tr>

            </thead>

            <tbody id="tbody">

            </tbody>

        </table>

    </div>

    <script type="module" src="JS/base.js"></script>

</body>

</html>
