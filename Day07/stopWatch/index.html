<html>

<head>
    <title>Stop Watch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="title">
            www.online-stopwatch.com
        </div>

        <div class="display">
            <span id="time">00:00:00</span>
            <div id="ms">00</div>
        </div>

        <div class="buttons">
            <button id="pauseBtn" class="pause" onclick="pauseWatch()">
                Pause
            </button>

            <button id="clearBtn" onclick="clearWatch()">
                Clear
            </button>
        </div>

    </div>

    <script src="index.js"></script>

</body>

</html>
