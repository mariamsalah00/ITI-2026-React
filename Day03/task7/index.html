<html>

<head>
    <title>task7</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">
        <div class="header-bg">
            <h1 class="header-title">sponsorship</h1>
            <div class="header-graphic">
                <img src="images/logo.jpg" width="200" >
            </div>
        </div>
        <form action="main.html" method="post">
            <table class="form-table" border="0" cellspacing="0" cellpadding="0">
                <tr>
                    <td colspan="6">
                        <div class="icon">
                           <img src="images/first.jpg">
                        </div>
                        <h2 class="section-heading">non-profit organization</h2>
                    </td>
                </tr>
                <tr>
                    <td colspan="3" style="padding-right: 15px; padding-bottom: 12px;">
                        <label class="field-label">name:</label>
                        <input type="text" class="input-field">
                    </td>
                    <td colspan="3" style="padding-left: 15px; padding-bottom: 12px;">
                        <label class="field-label">phone number:</label>
                        <input type="text" class="input-field">
                    </td>
                </tr>
                <tr>
                    <td colspan="6" style="padding-bottom: 12px;">
                        <label class="field-label">street address:</label>
                        <input type="text" class="input-field">
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="padding-right: 15px; padding-bottom: 12px;">
                        <label class="field-label">city:</label>
                        <input type="text" class="input-field">
                    </td>
                    <td colspan="2" style="padding-left: 10px; padding-right: 10px; padding-bottom: 12px;">
                        <label class="field-label">state:</label>
                        <input type="text" class="input-field">
                    </td>
                    <td colspan="2" style="padding-left: 15px; padding-bottom: 12px;">
                        <label class="field-label">zip code:</label>
                        <input type="text" class="input-field">
                    </td>
                </tr>
                <tr>
                    <td colspan="6" class="section-divider"></td>
                </tr>
                <tr>
                    <td colspan="6">
                        <div class="icon">
                            <img src="images/second.jpg">
                        </div>
                        <h2 class="section-heading">sponsor contact information</h2>
                    </td>
                </tr>
                <tr>
                    <td colspan="3" style="padding-right: 15px; padding-bottom: 12px;">
                        <label class="field-label">first name:</label>
                        <input type="text" class="input-field">
                    </td>
                    <td colspan="3" style="padding-left: 15px; padding-bottom: 12px;">
                        <label class="field-label">last name:</label>
                        <input type="text" class="input-field">
                    </td>
                </tr>
                <tr>
                    <td colspan="3" style="padding-right: 15px; padding-bottom: 12px;">
                        <label class="field-label">phone number:</label>
                        <input type="text" class="input-field">
                    </td>
                    <td colspan="3" style="padding-left: 15px; padding-bottom: 12px;">
                        <label class="field-label">email address:</label>
                        <input type="text" class="input-field">
                    </td>
                </tr>
                <tr>
                    <td colspan="6" style="padding-bottom: 12px;">
                        <label class="field-label">street address:</label>
                        <input type="text" class="input-field">
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="padding-right: 15px; padding-bottom: 12px;">
                        <label class="field-label">city:</label>
                        <input type="text" class="input-field">
                    </td>
                    <td colspan="2" style="padding-left: 10px; padding-right: 10px; padding-bottom: 12px;">
                        <label class="field-label">state:</label>
                        <input type="text" class="input-field">
                    </td>
                    <td colspan="2" style="padding-left: 15px; padding-bottom: 12px;">
                        <label class="field-label">zip code:</label>
                        <input type="text" class="input-field">
                    </td>
                </tr>
                <tr>
                    <td colspan="6" class="section-divider"></td>
                </tr>
                <tr>
                    <td colspan="6" style="padding-bottom: 10px;">
                        <div class="icon">
                            <img src="images/third.jpg">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td colspan="3" style="padding-right: 15px; padding-bottom: 30px;">
                        <label class="field-label">donation amount:</label>
                        <select class="select-field">
                            <option value=""></option>
                            <option value="25">$25</option>
                            <option value="50">$50</option>
                            <option value="100">$100</option>
                        </select>
                    </td>
                    <td colspan="3" style="padding-left: 15px; padding-bottom: 30px;">
                        <label class="field-label">payment method:</label>
                        <select class="select-field">
                            <option value=""></option>
                            <option value="credit">Credit Card</option>
                            <option value="paypal">PayPal</option>
                            <option value="check">Check</option>
                        </select>
                    </td>
                </tr>
            </table>
            <div class="footer-bg">
                <input type="submit" value="Submit" class="submit-btn">
            </div>
        </form>
    </div>

</body>

</html>
